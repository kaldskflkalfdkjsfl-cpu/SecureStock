services:
  web:
    build: .
    container_name: securestock-web
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-CHANGE-ME-IN-PRODUCTION}
      FERNET_KEY: ${FERNET_KEY:-}
      SESSION_COOKIE_SECURE: "False"
      HOST: 0.0.0.0
      PORT: "5000"
    volumes:
      - secstock_instance:/app/instance
      - secstock_uploads:/app/uploads
    restart: unless-stopped

volumes:
  secstock_instance:
  secstock_uploads: