{% extends "base.html" %}

  <div class="ss-error-icon"><i class="bi bi-compass"></i></div>
  <div class="ss-error-code mb-2">Error 404</div>
  <h1 class="h4 fw-bold">Not Found</h1>

</div>
{% endblock %}
