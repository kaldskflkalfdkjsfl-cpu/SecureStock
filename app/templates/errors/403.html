{% extends "base.html" %}
{% block title %}Forbidden — SecureStock{% endblock %}
{% block content %}
<div class="text-center ss-error">
  <div class="ss-error-icon"><i class="bi bi-shield-x"></i></div>
  <div class="ss-error-code mb-2">Error 403</div>
  <h1 class="h4 fw-bold">Forbidden</h1>
  <p class="text-muted">You do not have permission to access this resource.</p>
  <a class="btn btn-primary mt-2" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"><i class="bi bi-house-door me-1"></i>Go home</a>
</div>
{% endblock %}
