{% extends "base.html" %}
{% block title %}Too Many Requests — SecureStock{% endblock %}
{% block content %}
<div class="text-center ss-error">
  <div class="ss-error-icon"><i class="bi bi-hourglass-split"></i></div>
  <div class="ss-error-code mb-2">Error 429</div>
  <h1 class="h4 fw-bold">Too Many Requests</h1>
  <p class="text-muted">You have sent too many requests in a short time. Please wait and try again.</p>
  <a class="btn btn-primary mt-2" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"><i class="bi bi-house-door me-1"></i>Go home</a>
</div>
{% endblock %}
